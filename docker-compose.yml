version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cdsqg_postgres
    restart: always
    environment:
      POSTGRES_DB: cdsqg_db
      POSTGRES_USER: cdsqg_user
      POSTGRES_PASSWORD: cdsqg_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cdsqg_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cdsqg.gov.vn
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
